# Keeps this practice set's vendored Precedent engine current, unattended.
#
# WHY THIS SHIPS WITH EVERY SOURCE SET (practice: cite-the-incident). A
# source set vendors Precedent's engine as tracked files under tools/, and
# until 2026-09-06 nothing told anyone when that copy went stale. Two real
# sets sat more than two hundred commits behind, both generating a loader
# block with a defect fixed upstream days earlier, and it surfaced only
# because a session happened to have a BestPractice clone attached and
# happened to run a check by hand. Refreshing needs a clone of the upstream
# repo, which a person's ordinary session has no reason to have -- so the
# check has to run somewhere that always can. That is here.
#
# GITHUB SETTING THIS NEEDS, AND IT IS NOT ON BY DEFAULT (practice:
# github-setup-disclosed). Opening a pull request from a workflow requires
# "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General -> Workflow permissions. Without it the
# run FAILS at the pull-request step rather than passing quietly -- that is
# deliberate: a silent no-op here would recreate the exact problem this
# workflow exists to fix.
#
# It opens a pull request and stops. It never merges: this set's own rules
# decide that, and a workflow shipped in a template cannot know them.
name: Refresh vendored Precedent engine

on:
  schedule:
    - cron: '17 6 * * 1'      # Mondays, 06:17 UTC -- off the hour, where every
                              # naively-scheduled job piles up and gets delayed
  workflow_dispatch:          # so a person can ask for it without waiting a week

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the upstream engine
        run: |
          git clone --quiet --depth 1 --branch precedent-beta-v01 \
            https://github.com/alex137/BestPractice.git /tmp/bestpractice
          echo "UPSTREAM=$(git -C /tmp/bestpractice rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh and regenerate
        run: |
          python3 tools/precedent_vendor_engine.py refresh /tmp/bestpractice
          # The engine bump and its output land together. A refreshed
          # generator whose views have not been re-run leaves this repo's
          # committed AGENTS.md describing the OLD engine's output, which
          # the repo's own --check then fails on.
          python3 tools/build_views.py

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The diff is the signal, not a parsed notice string. If the
          # refresh produced no change, the engine was already current and
          # there is nothing to say.
          if [ -z "$(git status --porcelain)" ]; then
            echo "vendored engine already current at ${UPSTREAM}"
            exit 0
          fi
          BRANCH="precedent/engine-refresh-${UPSTREAM:0:12}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Refresh the vendored Precedent engine to ${UPSTREAM:0:12}"
          git push --force-with-lease -u origin "$BRANCH"
          # An existing open PR for this exact upstream commit means a
          # previous run already did this and nobody has merged it yet --
          # re-opening would just make noise.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "a pull request for $BRANCH is already open"
            exit 0
          fi
          gh pr create --head "$BRANCH" --base "$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --title "Refresh the vendored Precedent engine to ${UPSTREAM:0:12}" \
            --body "$(printf '%s\n' \
              "Automated by \`.github/workflows/engine-refresh.yml\`." \
              "" \
              "Upstream \`precedent-beta-v01\` moved to \`${UPSTREAM}\`, so this set's" \
              "vendored engine under \`tools/\` was behind. This refreshes it and" \
              "regenerates the views that engine produces, in one commit -- they have" \
              "to land together, or this repo's own \`build_views.py --check\` fails." \
              "" \
              "Review the diff as you would any engine bump. Nothing here merges" \
              "itself: this set's own rules decide that.")"
