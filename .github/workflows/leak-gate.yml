name: Leak gate

# Precedent is a branch of a public repository: a push is a publication.
# The local pre-push hook (templates/hooks/pre-push) is the complete gate —
# it can load a private-term blocklist from outside the repo. This workflow
# is the STRUCTURAL backstop that a `git push --no-verify` cannot bypass,
# because it runs on the server.
#
# ON MAIN ONLY SINCE 2026-10-10 (Morgan: "it's important that leak-gate goes
# to every branch, but the check must be local to avoid lots of github
# minutes billing issues"). Until then it ran on every push to every branch,
# one billed job per push, and the branch pushes of a single day's work ran
# it dozens of times. Every branch is still checked before it is published,
# locally: the global pre-push hook tools/commit-identity.sh writes at every
# session start runs tools/leak_gate.py over each commit a push carries, for
# a plain `git push` as much as for one the push check gates. What a branch
# push gives up is the server-side scan of a `git push --no-verify`.

on:
  # push only, deliberately — and this file is where the pattern started.
  # deep-check.yml copied the every-branch scope above on 2026-09-03 and the
  # unexamined `pull_request:` line came with it, so both workflows fired
  # TWICE for every push to a branch with an open PR: same SHA, seconds
  # apart. Four such pairs here on 2026-09-06 — runs #422/#423, #426/#427,
  # #430/#431, #436/#437 — every one agreeing, because the push run tests
  # the branch tip and the pull_request run tests head-merged-into-base, and
  # those are the same tree whenever the branch is current with its base.
  #
  # The scope reasoning above is untouched. This still runs on every branch,
  # server-side, which is the part `git push --no-verify` cannot bypass.
  #
  # PUT `pull_request:` BACK IF A PR EVER ARRIVES FROM A FORK — and here that
  # matters more than it does for the deep check. A fork's pushes do not fire
  # `push` in this repo, so a forked PR would first be scanned by the merge
  # commit's own run, which is to say AFTER it lands; and this gate exists
  # precisely because for a leak there is no grace period and nothing to
  # force-push away. A failed deep check that lands is fixable forward; a leak
  # that lands is published. What stands in for it meanwhile is human, not
  # mechanical: INSTALL.md sec.4's reviewer and AGENTS.md's second scrub line.
  # Every PR to date (#83-#123, checked 2026-09-07) came from a branch inside
  # this repo.
  push:
    # main only: every other branch is gated locally, before the push (see
    # the top of this file). precedent-beta-v01, the old name of staging,
    # needs no exception any more.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-gate:
    name: Leak gate (structural)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --structural-only, by name and on purpose. This runner has no private
      # blocklist and never will, so the vocabulary layer cannot run here --
      # and since 2026-09-08 the gate REFUSES rather than reporting PARTIAL
      # when precedent.json declares a private source, which is the correct
      # default for a person about to push and the wrong one for CI. The job
      # is called "Leak gate (structural)" precisely because this half is all
      # it can do; the flag makes that a statement instead of a side effect.
      - name: Run the leak gate over the tracked tree (structural half only)
        run: python3 tools/leak_gate.py --structural-only
