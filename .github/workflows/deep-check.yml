name: Deep check

# The three tools AGENTS.md's own "deep check" gate suite names besides
# doc_lint.py and leak_gate.py.
#
# 2026-09-21: doc_lint.py NO LONGER RUNS IN CI ANYWHERE. Its workflow
# (docs.yml here, bestpractice-docs.yml in a consuming repo) is retired,
# and the Markdown lint runs before every commit instead, as the light
# check. It was re-checking work a session had just cleared. The linter is
# not retired -- only the workflow whose whole job was to run it a second
# time. leak_gate.py keeps its own workflow, because a push IS the
# publication it guards and only the server-side copy sees that.
#
# Until this file existed, none of these three ran in CI at
# all -- they were session discipline only (AGENTS.md: "deep check is the
# full gate suite run before push or merge"), and TODO.md's own item 1
# already named the gap ("required CI checks bind every path to the
# default branch [...] runbook gates bind only sessions that run the
# runbook"). A 2026-09-03 deep-check audit found two critical,
# reproduced bugs and three other real gaps sitting in exactly this
# territory -- verify_harness.py, precedent_check.py -- none of which a
# passing doc_lint or leak_gate run would ever have caught, on a branch
# whose own merges are all green. This closes that: the same three tools
# a session is already supposed to run before every push or merge, now
# bound to every push, on every branch.
#
# Ran on every branch, not just main, from this file's first commit through
# 2026-09-19 -- same reasoning as leak-gate.yml then: on this project the
# branch IS the published artifact.
#
# NAMED-BRANCH SCOPE, 2026-09-19: this repo has no billing pressure --
# public, unmetered Actions minutes -- but the four private practice sets
# whose own CI templates this repo owns had exactly that pressure the same
# day, and the fix there (branch-scoped `push:` + `pull_request:` for
# everything else, spec/CI_MINUTES_PLAN.md item 8) is worth this repo
# holding itself to as well: a template this repo ships ought to look like
# the discipline it teaches, not just cost nothing because it's public.
# `branches: [main, precedent-beta-v01]` replaces every-branch scope -- the
# two branches that actually receive merges.

on:
  # `pull_request:` (opened, reopened, ready_for_review) is BACK, 2026-09-19 -- read the
  # 2026-09-07 removal note directly below for why it was dropped, and why
  # this doesn't reintroduce what it measured. The duplicate pairs found
  # then happened because push ran on EVERY branch, so a push to a branch
  # with an open PR fired both events for the identical tree. With push now
  # scoped to only `main`/`precedent-beta-v01` -- neither of which is ever
  # a PR's own head branch -- a PR's branch only ever gets pull_request
  # events and main/precedent-beta-v01 only ever get push events. Nothing
  # here fires twice for the same commit, and a branch with no open PR now
  # costs nothing at all rather than a full run on every push.
  # `synchronize` removed 2026-09-21 -- it fired on every push to a PR
  # branch, billing a run per intermediate commit to check a tree that was
  # superseded minutes later. The PR is still checked when it opens, when
  # a draft becomes ready, and when it lands on a named branch. See
  # templates/github-actions/doc-lint.yml.template's header for the
  # measurement, and spec/BILLING_FLOOR.md for why the trigger, not the
  # per-job floor, was the driver in the repo where this was found.
  # BACK, FOR PULL REQUESTS INTO MAIN, 2026-09-25 (spec/BRANCH_TIERS_PLAN.md):
  # this repo's one GitHub test, on the pull request that carries staging
  # into main -- the one place a clean machine without the private sources
  # can catch what a local run cannot. Pushes to main joined it on
  # 2026-09-27 (below); every other push is checked locally.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

  # push only sat here, deliberately, from 2026-09-07 to 2026-09-19.
  # `pull_request:` sat here from this file's first commit (2236a94, copied
  # wholesale from leak-gate.yml along with the every-branch scope above)
  # and fired a SECOND run of every push on any branch with an open PR:
  # same SHA, 2-37 seconds apart. Measured 2026-09-07 over 13 fully paired
  # runs from 2026-09-06 -- the pair never once disagreed, including two
  # pairs that failed together. That is structural rather than luck: the
  # push run tests the branch tip, the pull_request run tests
  # head-merged-into-base, and those are the same tree whenever the branch
  # is current with its base, which the habit of merging the base branch in
  # keeps true here. Nothing is lost from the PR's own view -- check runs
  # attach to the head SHA whatever event produced them, so this workflow
  # still reports on the PR -- and the merge commit gets its own run on the
  # base branch afterwards, which is the only run that tests what actually
  # landed.
  #
  # A PR FROM A FORK still needs `pull_request:` -- a fork's pushes do not
  # fire `push` in this repo, so pull_request is what would catch it; it is
  # already back above, not a contingency to remember anymore. Every PR to
  # date (#83-#123, checked 2026-09-07) came from a branch inside this
  # repo, and the documented check-in flow keeps it that way: INSTALL.md
  # sec.4 has a dependent repo push its branch HERE from a dual-repo
  # session, because a single-repo session cannot write to this repo at
  # all -- it does not fork.
  #
  # EVERY PUSH TO MAIN, TOO, SINCE 2026-09-27 (spec/BRANCH_TIERS_PLAN.md,
  # "Public repositories test every push to main"). The pull request above
  # tests a change BEFORE it lands; this tests what actually landed, and it
  # is the only GitHub test a commit gets when it reaches main without that
  # pull request -- a direct push, an edit on github.com, a bot commit.
  # Morgan: "all pushes to main, on repos that are public, should get the
  # GitHub ci/cd. It doesn't matter that the same check happened (on our
  # server) on local before that, it's a good double check" (strength:
  # decided). After an ordinary merge the files are exactly the ones the
  # pull request's run just passed, and the already-tested job below skips
  # the rest -- the same day's second decision, to save the minutes.
  push:
    branches: [main]
  #
  # WHY PUSHES TO EVERY OTHER BRANCH STILL GET NO RUN: on 2026-09-25 both
  # triggers were commented out and this ran only when started by hand.
  # Every one of its three tools runs before each push from a session, on
  # our own machine, as part of tools/precedent_push_check.py
  # (push-check-gate.sh refuses the push until it passes). Morgan asked that
  # these checks run "on our side, not on github minutes", and agreed to
  # pausing this one while keeping leak-gate.yml, which covers changes that
  # never pass through a session (strength: assented -- "Sure let's follow
  # your recommendation"). The pull request into main came back the same
  # day and pushes to main on 2026-09-27; the rest stays paused.
  workflow_dispatch:
  # ONCE A DAY, THE WHOLE SUITE (Alex, 2026-10-12: "yes on daily run").
  # A pull request and a push to main run only the checks the change
  # reaches (tools/harness_reach.py). This run checks everything, catches
  # what a scoped run cannot see -- a check whose verdict hangs on the
  # clock, or on state another check left -- and records a fresh ledger of
  # what each check reaches. 07:17 UTC is the small hours in New York;
  # about 15 minutes of runner time a day.
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  # To look up whether this workflow already passed on the same files (the
  # already-tested job below). Read-only.
  actions: read

# verify_harness.py's own timing instrumentation (practice:
# slow-steps-report-and-cache) measured a full local run at 149.9s with one
# check, check_precedent_check_fires, accounting for 71.6s of it (~48%) --
# see spec/VERIFY_HARNESS_PERFORMANCE.md and the 2026-09-18 follow-up in
# gotchas/gotcha-2026-09-18-verify-harnesss-stress-checks-can-oom-kill-the-bash-tools.md's
# Resolution section. verify_harness.py's PRECEDENT_CHECK_ONLY/SKIP (added
# the same day) split that one check into its own job below, run in
# parallel with everything else -- wall-clock for this workflow's slowest
# leg becomes roughly the max of the two jobs instead of their sum.
# precedent_check.py and doc_sync.py are unrelated tools with no dependency
# on verify_harness.py's checks, so they run as a third parallel job rather
# than waiting behind either.
jobs:
  # Decides, on a push to main, whether the three jobs below have anything
  # to do (the step's own comment says how). On a pull request or a run
  # started by hand it is skipped, and they run as always. If it fails,
  # they run too: `!cancelled()` lets a failed or skipped decision through.
  already-tested:
    name: Already tested?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # issues: write only for the step that closes a main-test-failed issue
    # when these files already passed. A job's permissions replace the
    # workflow's, so the two read ones are said again here.
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      skip: ${{ steps.already.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A PUSH TO MAIN RE-RUNS NOTHING THAT ALREADY PASSED (2026-09-27,
      # spec/BRANCH_TIERS_PLAN.md). Morgan: "we're very cautious about the
      # minutes ... it should not run the second time ... if it had just
      # run before, and nothing had changed" (strength: decided).
      #
      # "Nothing changed" is decided by git, exactly: the pushed commit's
      # files are identical to a commit this same workflow already passed
      # on, and anything else the push brought in was already inside that
      # commit. That is the ordinary Promote merge -- the pull request's
      # head already contains main, so the merge lands the very files its
      # pull-request run tested. Anything short of certain runs the check:
      # main moved in between, no passing run found, the API unreachable,
      # a shallow checkout. A re-run of a push that already passed skips
      # too; start one by hand (workflow_dispatch) to force it.
      - name: Skip if these exact files already passed this check
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          skip=false
          tested=''
          tree=$(git rev-parse "$GITHUB_SHA^{tree}" 2>/dev/null) || tree=''
          parents=$(git rev-list --parents -n 1 "$GITHUB_SHA" 2>/dev/null | cut -s -d' ' -f2-)
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id 2>/dev/null) || wf=''
          if [ -n "$tree" ] && [ -n "$wf" ]; then
            for x in "$GITHUB_SHA" $parents; do
              [ "$(git rev-parse "$x^{tree}" 2>/dev/null)" = "$tree" ] || continue
              covered=true
              for p in $parents; do
                [ "$p" = "$x" ] || git merge-base --is-ancestor "$p" "$x" || covered=false
              done
              [ "$covered" = true ] || continue
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$x&status=success&per_page=1" --jq .total_count 2>/dev/null) || n=0
              if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
                skip=true
                tested=$x
                break
              fi
              # MERGED WHILE ITS PULL REQUEST'S TEST WAS STILL GOING
              # (2026-10-12): a direct-route merge lands the moment the pull
              # request opens, and this job used to start a second run of
              # the same files beside the first. That run's verdict is
              # main's: it files the main-test-failed issue on a failure and
              # marks these files passed on a success, by their tree.
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$x&per_page=10" \
                --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $GITHUB_RUN_ID)] | length" 2>/dev/null) || n=0
              if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
                skip=true
                tested="$x, whose own run is still going and decides"
                break
              fi
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          deferred=false
          [ "$skip" = true ] && [ "${tested#*still going}" != "$tested" ] && deferred=true
          echo "deferred=$deferred" >> "$GITHUB_OUTPUT"
          if [ "$deferred" = true ]; then
            msg="Skipped: these exact files are already being tested on $tested."
          elif [ "$skip" = true ]; then
            msg="Skipped: these exact files already passed this check on $tested."
          else
            msg="Running: no earlier passing run of this check on these exact files."
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # MAIN IS GREEN WITHOUT A RUN: these exact files already passed, so the
      # deep-check job is skipped and its own close step never runs. Close a
      # main-test-failed issue from here instead (tools/close_main_test_issue.sh;
      # the step in the deep-check job says why).
      - name: Close the issue when these files already passed
        if: steps.already.outputs.skip == 'true' && steps.already.outputs.deferred != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOW: these exact files already passed this check
        run: bash tools/close_main_test_issue.sh

  # ONE JOB, THE SAME COMMAND A SESSION RUNS, since 2026-10-07. Until then
  # this was three jobs: the heavy check, "everything else", and
  # precedent_check + doc_sync. "Everything else" ran about 570 checks one
  # after another on one core and took 30 minutes, on every Promote into
  # main. The suite had been split across the cores locally on 2026-09-30
  # (`--as-ci`), measured locally, and never carried here: this file and
  # the harness's CI_SHARDS table each described the split, and only one
  # of them moved (gotcha-2026-10-07-a-speed-fix-to-a-mirrored-test-
  # reached-only-the-local-copy). Now there is one description, in the
  # harness, and this job runs it: `--as-ci` starts the heavy shard and
  # the dealt parts of the rest side by side, on the runner's cores.
  # verify_harness's check_as_ci_shards_match_the_workflow refuses any
  # other way of running the suite here.
  #
  # One job instead of three also bills one rounded-up job instead of
  # three (actions-minutes-are-scarce). The three billed about 37 minutes
  # a run on 2026-10-07 (30, 5 and 1, each rounded up); this one should
  # bill near the local --as-ci time, about 11, until a run measures it.
  # The cheap checks run first, so a red precedent_check stops the run
  # before the long step starts (gates-fail-fast).
  deep-check:
    name: precedent_check + doc_sync + verify_harness --as-ci
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # The workflow's two read permissions, plus issues: write for the steps
    # that open an issue on a failure and close it on a pass, and
    # contents: write for the one that
    # pushes the passed marker. A job's permissions replace the workflow's,
    # so the read one is said again here. Write access in a job that runs
    # the branch's own code gives nothing new: a pull request from this
    # repository is opened by someone who can already push, and a fork's
    # pull request gets a read-only token whatever this says.
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history, not the actions/checkout default (fetch-depth: 1).
          # precedent_check.py's parallel-artifact-ledger (scope 'tree') walks
          # `git log --no-merges -- <member-dir>` across this repo's real
          # history; on a depth-1 checkout that history isn't there to walk,
          # and a check finding nothing to flag is indistinguishable from one
          # that had nothing wrong to find -- see AGENTS.md's own
          # "scope: 'tree' check... false pass on an under-fetched clone"
          # gotcha, confirmed for real here: this workflow ran with no
          # fetch-depth set (so depth 1) from the day it was added, and
          # parallel-artifact-ledger was silently red on every push until
          # this fix -- the check simply never had enough history to run
          # for real, on `main` or any branch, until now.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      - name: Run precedent_check.py
        run: python3 tools/precedent_check.py

      - name: Run doc_sync.py
        run: python3 tools/doc_sync.py

      # Every planted case, no rotation: CI_SHARDS gives the heavy shard
      # PRECEDENT_HARNESS_ALL=1. This run is the one nobody is watching and
      # the last gate before main, so rotation buys nothing it needs.
      # Scoped to the change (tools/harness_reach.py) unless this is the
      # daily run or one started by hand. A whole-suite run into or on main
      # -- daily, by hand, or because the change reached most of the suite
      # -- records the ledger of what each check reaches.
      - name: Run the verification harness, side by side
        env:
          PRECEDENT_HARNESS_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          PRECEDENT_HARNESS_RECORD_FULL: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && '1' || '' }}
        run: python3 tools/verify_harness.py --as-ci

      # A whole-suite run into or on main that passed leaves the ledger the
      # scoped runs select from -- a pull request's too, since main's own
      # run of the same files is then skipped. Only a green run: a failing
      # check may have stopped before it reached everything it would.
      - name: Publish the reach ledger
        if: >-
          success() && hashFiles('.precedent/harness_reach.json') != '' && (
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        run: python3 tools/harness_reach.py publish

      # MAIN'S TEST PASSED: CLOSE THE ISSUE THAT SAID IT FAILED (2026-10-10).
      # The step at the end of this job opens a main-test-failed issue when
      # main's test fails; nothing closed it, and issue #1036 stayed open
      # about eleven hours while main passed at least three times, so the
      # next session was sent to fix a green main. Only on success, and only
      # on main itself (a push, or the button), never on a pull request: a
      # pull request into main passing says nothing about main. The script
      # closes nothing unless this run tested main's current head, so an
      # older run finishing green cannot close a newer failure. The
      # already-tested job does the same when it skips this one.
      - name: Close the issue when main's test passes again
        if: >-
          success() &&
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOW: this run passed
        run: bash tools/close_main_test_issue.sh

      # MAIN'S TEST PASSED: LEAVE A MARKER ANY CLONE CAN READ (Morgan,
      # 2026-10-10: "yes, build it and take it to main"). Update Vendors in
      # another repository takes only a main whose test passed, and a
      # session there usually cannot ask GitHub's API about this one, so it
      # took main on trust. This pushes refs/precedent/passed/<tree> at the
      # commit it tested, and plain git reads it (precedent_branches.
      # passed_markers). The tree, not the commit: a pull request's run
      # tests the merge of its head into main, and main's own commit after
      # the merge has the same files. A push to a refs/precedent/ ref starts
      # no workflow. Only when everything above passed, on the same runs the
      # failure step below covers; a few seconds, no extra job.
      - name: Mark these files as passed
        if: >-
          success() && (
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main'))
        continue-on-error: true
        run: |
          set -u
          tree=$(git rev-parse 'HEAD^{tree}')
          git push --quiet origin "HEAD:refs/precedent/passed/$tree" \
            || echo "::warning::Could not push the passed marker for $tree; Update Vendors elsewhere falls back to asking GitHub."

      # MAIN'S TEST FAILED: SAY SO WHERE NOBODY CAN MISS IT (2026-10-09, the
      # main landing plan, piece B, layer 2). Approved by Morgan with the
      # plan that names this step, 2026-10-09: "Act on the ... plan". A
      # red main used to be found by whoever looked next. This files an
      # issue labelled main-test-failed, or adds the run to the one already
      # open, and the next session here lists it first
      # (tools/open_failures.py); a pass on main's head closes it
      # (tools/close_main_test_issue.sh, from either job). Only when a step
      # above failed, and only on main itself (a push, or the button) or a
      # pull request into main. No
      # extra job and no extra runner: a few seconds, on a failure only.
      # A fork's pull request gets a read-only token, so the step may fail
      # there; continue-on-error keeps that from hiding the real failure.
      - name: Open an issue when main's test fails
        if: >-
          failure() && (
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          label=main-test-failed
          if [ -n "$PR_NUMBER" ]; then
            where="pull request #$PR_NUMBER into main"
          else
            where="main @ ${GITHUB_SHA:0:12}"
          fi
          failing=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join(", ")' \
            2>/dev/null) || failing=''
          body="GitHub's test failed on $where.

          Run: $RUN_URL
          Failing: ${failing:-could not be read; open the run}

          Until main's test passes again, Update Vendors in other repositories takes the last main whose test passed. Fix it before other work, then close this issue."
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty' 2>/dev/null) || open=''
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create "$label" --color B60205 --description "GitHub's test on main failed" 2>/dev/null || true
            gh issue create --title "main's test failed" --label "$label" --body "$body"
          fi
