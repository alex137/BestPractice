name: Deep check

# The three tools AGENTS.md's own "deep check" gate suite names besides
# doc_lint.py and leak_gate.py.
#
# 2026-09-21: doc_lint.py NO LONGER RUNS IN CI ANYWHERE. Its workflow
# (docs.yml here, bestpractice-docs.yml in a consuming repo) is retired,
# and the Markdown lint runs before every commit instead, as the light
# check. It was re-checking work a session had just cleared. The linter is
# not retired -- only the workflow whose whole job was to run it a second
# time. leak_gate.py keeps its own workflow, because a push IS the
# publication it guards and only the server-side copy sees that.
#
# Until this file existed, none of these three ran in CI at
# all -- they were session discipline only (AGENTS.md: "deep check is the
# full gate suite run before push or merge"), and TODO.md's own item 1
# already named the gap ("required CI checks bind every path to the
# default branch [...] runbook gates bind only sessions that run the
# runbook"). A 2026-09-03 deep-check audit found two critical,
# reproduced bugs and three other real gaps sitting in exactly this
# territory -- verify_harness.py, precedent_check.py -- none of which a
# passing doc_lint or leak_gate run would ever have caught, on a branch
# whose own merges are all green. This closes that: the same three tools
# a session is already supposed to run before every push or merge, now
# bound to every push, on every branch.
#
# Ran on every branch, not just main, from this file's first commit through
# 2026-09-19 -- same reasoning as leak-gate.yml then: on this project the
# branch IS the published artifact.
#
# NAMED-BRANCH SCOPE, 2026-09-19: this repo has no billing pressure --
# public, unmetered Actions minutes -- but the four private practice sets
# whose own CI templates this repo owns had exactly that pressure the same
# day, and the fix there (branch-scoped `push:` + `pull_request:` for
# everything else, spec/CI_MINUTES_PLAN.md item 8) is worth this repo
# holding itself to as well: a template this repo ships ought to look like
# the discipline it teaches, not just cost nothing because it's public.
# `branches: [main, precedent-beta-v01]` replaces every-branch scope -- the
# two branches that actually receive merges.

on:
  # `pull_request:` (opened, reopened, ready_for_review) is BACK, 2026-09-19 -- read the
  # 2026-09-07 removal note directly below for why it was dropped, and why
  # this doesn't reintroduce what it measured. The duplicate pairs found
  # then happened because push ran on EVERY branch, so a push to a branch
  # with an open PR fired both events for the identical tree. With push now
  # scoped to only `main`/`precedent-beta-v01` -- neither of which is ever
  # a PR's own head branch -- a PR's branch only ever gets pull_request
  # events and main/precedent-beta-v01 only ever get push events. Nothing
  # here fires twice for the same commit, and a branch with no open PR now
  # costs nothing at all rather than a full run on every push.
  # `synchronize` removed 2026-09-21 -- it fired on every push to a PR
  # branch, billing a run per intermediate commit to check a tree that was
  # superseded minutes later. The PR is still checked when it opens, when
  # a draft becomes ready, and when it lands on a named branch. See
  # templates/github-actions/doc-lint.yml.template's header for the
  # measurement, and spec/BILLING_FLOOR.md for why the trigger, not the
  # per-job floor, was the driver in the repo where this was found.
  # PAUSED 2026-09-25 -- see the note above `workflow_dispatch` below.
  # pull_request:
  #   types: [opened, reopened, ready_for_review]

  # push only sat here, deliberately, from 2026-09-07 to 2026-09-19.
  # `pull_request:` sat here from this file's first commit (2236a94, copied
  # wholesale from leak-gate.yml along with the every-branch scope above)
  # and fired a SECOND run of every push on any branch with an open PR:
  # same SHA, 2-37 seconds apart. Measured 2026-09-07 over 13 fully paired
  # runs from 2026-09-06 -- the pair never once disagreed, including two
  # pairs that failed together. That is structural rather than luck: the
  # push run tests the branch tip, the pull_request run tests
  # head-merged-into-base, and those are the same tree whenever the branch
  # is current with its base, which the habit of merging the base branch in
  # keeps true here. Nothing is lost from the PR's own view -- check runs
  # attach to the head SHA whatever event produced them, so this workflow
  # still reports on the PR -- and the merge commit gets its own run on the
  # base branch afterwards, which is the only run that tests what actually
  # landed.
  #
  # A PR FROM A FORK still needs `pull_request:` -- a fork's pushes do not
  # fire `push` in this repo, so pull_request is what would catch it; it is
  # already back above, not a contingency to remember anymore. Every PR to
  # date (#83-#123, checked 2026-09-07) came from a branch inside this
  # repo, and the documented check-in flow keeps it that way: INSTALL.md
  # sec.4 has a dependent repo push its branch HERE from a dual-repo
  # session, because a single-repo session cannot write to this repo at
  # all -- it does not fork.
  # push:
  #   branches: [main, precedent-beta-v01]
  #
  # PAUSED 2026-09-25: both triggers above are commented out, so this runs
  # only when started by hand. Every one of its three tools now runs before
  # each push from a session, on our own machine, as part of
  # tools/precedent_push_check.py (push-check-gate.sh refuses the push until
  # it passes). Morgan asked that these checks run "on our side, not on
  # github minutes", and agreed to pausing this one while keeping
  # leak-gate.yml, which covers changes that never pass through a session
  # (strength: assented -- "Sure let's follow your recommendation"). Paused
  # rather than deleted because tools/precedent_decommission.py requires a
  # cycle to pass before a live workflow's files go (decommission-deletes-
  # files); delete it with that tool once one has.
  workflow_dispatch:

permissions:
  contents: read

# verify_harness.py's own timing instrumentation (practice:
# slow-steps-report-and-cache) measured a full local run at 149.9s with one
# check, check_precedent_check_fires, accounting for 71.6s of it (~48%) --
# see spec/VERIFY_HARNESS_PERFORMANCE.md and the 2026-09-18 follow-up in
# gotchas/gotcha-2026-09-18-verify-harnesss-stress-checks-can-oom-kill-the-bash-tools.md's
# Resolution section. verify_harness.py's PRECEDENT_CHECK_ONLY/SKIP (added
# the same day) split that one check into its own job below, run in
# parallel with everything else -- wall-clock for this workflow's slowest
# leg becomes roughly the max of the two jobs instead of their sum.
# precedent_check.py and doc_sync.py are unrelated tools with no dependency
# on verify_harness.py's checks, so they run as a third parallel job rather
# than waiting behind either.
jobs:
  verify-harness-heavy:
    name: verify_harness (check_precedent_check_fires)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      # PRECEDENT_HARNESS_ALL=1 -- every planted case, no rotation.
      # Since 2026-09-21 an ordinary local run exercises a rotating slice
      # (~16 of 71) plus everything the change touched, which is the right
      # trade for a push a person is standing at. It is the wrong trade
      # here: this run is the one nobody is watching, it is the last gate
      # before a shared branch, and it is already paying for a checkout,
      # full history and a Python setup. Rotation buys nothing it needs.
      - name: Run the verification harness (heavy check only)
        run: python3 tools/verify_harness.py
        env:
          PRECEDENT_CHECK_ONLY: check_precedent_check_fires
          PRECEDENT_HARNESS_ALL: "1"

  verify-harness-rest:
    name: verify_harness (everything else)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      - name: Run the verification harness (all but the heavy check)
        run: python3 tools/verify_harness.py
        env:
          PRECEDENT_CHECK_SKIP: check_precedent_check_fires

  precedent-check-and-sync:
    name: precedent_check + doc_sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not the actions/checkout default (fetch-depth: 1).
          # precedent_check.py's parallel-artifact-ledger (scope 'tree') walks
          # `git log --no-merges -- <member-dir>` across this repo's real
          # history; on a depth-1 checkout that history isn't there to walk,
          # and a check finding nothing to flag is indistinguishable from one
          # that had nothing wrong to find -- see AGENTS.md's own
          # "scope: 'tree' check... false pass on an under-fetched clone"
          # gotcha, confirmed for real here: this workflow ran with no
          # fetch-depth set (so depth 1) from the day it was added, and
          # parallel-artifact-ledger was silently red on every push until
          # this fix -- the check simply never had enough history to run
          # for real, on `main` or any branch, until now.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      - name: Run precedent_check.py
        run: python3 tools/precedent_check.py

      - name: Run doc_sync.py
        run: python3 tools/doc_sync.py
