name: Documentation checks

# WHY THIS CHANGED (practice: cite-the-incident), 2026-09-14: until then the
# push trigger read `branches: [main]`, and `main` is the one branch nobody
# works on -- AGENTS.md routes every PR to `precedent-beta-v01` until the
# phase-7 fold-in. So the markdown linter ran on a branch with no traffic,
# and the branch carrying all of it was covered only when somebody opened a
# PR. A session pushing straight to `precedent-beta-v01` got no link check
# at all, which made doc_lint.py the one tool of AGENTS.md's five-tool "deep
# check" that CI did not run there.
#
# Measured before that change, 2026-09-14: a deliberately broken relative
# link planted in spec/LOADER.md failed `doc_lint.py` (exit 1) and was
# invisible to `precedent_check.py` (0 violated) -- so nothing else running
# on that push would have caught it. rename-updates-links covers a path this
# branch renamed AWAY; it has nothing to look for when the referring file is
# the one that moved, which is exactly what a directory reshuffle does.
#
# NAMED-BRANCH SCOPE, 2026-09-19: this repo has no billing pressure --
# public, unmetered Actions minutes -- but the four private practice sets
# whose own CI templates this repo owns had exactly that pressure the same
# day, and the fix there (branch-scoped `push:` + `pull_request:` for
# everything else, spec/CI_MINUTES_PLAN.md item 8) is worth this repo
# holding itself to as well, not because it saves money here but because a
# template this repo ships ought to look like the discipline it teaches.
# `branches: [main, precedent-beta-v01]` replaces every-branch scope; the
# two branches that actually receive merges are the ones worth a push run
# unconditionally, same reasoning as the 2026-09-14 change above, generalized
# to name both.
#
# `pull_request:` (opened, synchronize) is back, but scoped differently than
# the version removed 2026-09-14 below -- read that note for why it was
# dropped, and why this doesn't reintroduce what it measured. The duplicate
# pairs leak-gate.yml found happened because push ran on EVERY branch, so a
# push to a branch with an open PR fired both events for the identical tree.
# With push now scoped to only `main`/`precedent-beta-v01` -- neither of
# which is ever a PR's own head branch -- a PR's branch only ever gets
# pull_request events and main/precedent-beta-v01 only ever get push events.
# Nothing here fires twice for the same commit. PUT `pull_request:` back
# (it already is) IF A PR EVER ARRIVES FROM A FORK -- a fork's pushes do not
# fire `push` here, so pull_request is what would catch it; still true, and
# now already covered rather than a contingency.
on:
  push:
    branches: [main, precedent-beta-v01]
    paths:
      - "**/*.md"
      - "tools/doc_lint.py"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/*.md"
      - "tools/doc_lint.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      - name: Lint changed Markdown
        run: python3 tools/doc_lint.py
