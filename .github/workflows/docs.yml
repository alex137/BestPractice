name: Documentation checks

# Runs on every branch, and on push rather than pull_request -- the same
# shape deep-check.yml and leak-gate.yml already use, and for the same
# reason: on this project the branch IS the published artifact.
#
# WHY THIS CHANGED (practice: cite-the-incident). Until 2026-09-14 the push
# trigger read `branches: [main]`, and `main` is the one branch nobody works
# on -- AGENTS.md routes every PR to `precedent-beta-v01` until the phase-7
# fold-in. So the markdown linter ran on a branch with no traffic, and the
# branch carrying all of it was covered only when somebody opened a PR. A
# session pushing straight to `precedent-beta-v01` got no link check at all,
# which made doc_lint.py the one tool of AGENTS.md's five-tool "deep check"
# that CI did not run there.
#
# Measured before the change, 2026-09-14: a deliberately broken relative
# link planted in spec/LOADER.md failed `doc_lint.py` (exit 1) and was
# invisible to `precedent_check.py` (0 violated) -- so nothing else running
# on that push would have caught it. rename-updates-links covers a path this
# branch renamed AWAY; it has nothing to look for when the referring file is
# the one that moved, which is exactly what a directory reshuffle does.
#
# `pull_request:` is deliberately gone with it, not kept alongside. A push
# run and a pull_request run test the same tree whenever the branch is
# current with its base, and check runs attach to the head SHA whatever
# event produced them, so the PR still shows this result. leak-gate.yml
# measured the duplicate pairs this avoids. PUT `pull_request:` BACK IF A PR
# EVER ARRIVES FROM A FORK -- a fork's pushes do not fire `push` here.
on:
  push:
    paths:
      - "**/*.md"
      - "tools/doc_lint.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm markdown

      - name: Lint changed Markdown
        run: python3 tools/doc_lint.py
